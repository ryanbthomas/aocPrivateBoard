[project]
name = "aoc-scoreboard"
version = "0.1.0"
description = "Private Advent of Code scoreboard"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.54",              # NOT uvicorn[standard]
  "jinja2>=3.1",
  "sqlalchemy>=2.0.44",
  "alembic>=1.16",
  "pydantic>=2.14",             # 2.12 is the floor; 2.14 avoids the v1 shim entirely
  "pydantic-settings>=2.12",
  "httpx2>=2.16",
  "itsdangerous>=2.2",
]
# dropped: apscheduler  ← see §APScheduler below

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
